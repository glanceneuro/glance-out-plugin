# Build CI. There is deliberately NO deploy step -- see linux.yml for why.
#
# This is the job that matters most for this plugin: LhtrClient.cpp is the only
# file with real platform branches, and the Windows side (winsock2, WSAStartup,
# ioctlsocket, closesocket, send() returning int) is compiled nowhere else.
name: Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-windows:
    # PINNED, not windows-latest. The generator below is "Visual Studio 17 2022",
    # and windows-latest has moved to an image that ships a different Visual
    # Studio -- cmake then fails setup with "could not find any instance of
    # Visual Studio" before any of our code is compiled.
    #
    # Pinning is preferred over bumping the generator because the setup step
    # downloads open-ephys-lib-v1.0.0.zip, a PREBUILT binary. Building against a
    # newer MSVC toolset risks a link failure against that lib, which is a much
    # more confusing symptom than this one. If this image is ever retired, bump
    # the runner and the generator together and check that the lib still links.
    runs-on: [windows-2022]

    strategy:
      fail-fast: false
      matrix:
        # RelWithDebInfo rather than Debug, and that is forced, not a taste.
        # JUCE plants a tripwire symbol --
        #   this_will_fail_to_link_if_some_of_your_compile_units_are_built_in_debug_mode
        # -- that only a Debug-built JUCE exports, along with juce::logAssertion.
        # The open-ephys.lib published for this toolchain is Release-only, so a
        # Debug plugin has nothing to resolve those against and fails at link.
        # RelWithDebInfo still emits a PDB, which plain Release does not, so
        # this is the configuration that actually gives a debuggable binary.
        config: [Release, RelWithDebInfo]

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    # No wire-format step here: test/run_protocol_test.sh drives `c++`, which
    # is not reliably on PATH in this image's bash. The wire format is
    # platform-independent, so Linux and macOS cover it.

    - name: setup
      run: |
        cd ../..
        git clone https://github.com/open-ephys/plugin-GUI.git --branch main
        cd plugin-GUI/Build
        cmake -G "Visual Studio 17 2022" -A x64 ..
        mkdir -p Release
        curl -L https://openephys.jfrog.io/artifactory/GUI-binaries/Libraries/open-ephys-lib-v1.0.0.zip --output open-ephys-lib.zip
        unzip -o open-ephys-lib.zip -d Release
        # Release/ is the only folder needed: the plugin links
        # ${GUI_BASE_DIR}/Build/<CONFIGURATION_FOLDER>/open-ephys.lib, and
        # CONFIGURATION_FOLDER resolves to "Release" for every configuration
        # except Debug -- which this job deliberately does not build.
      shell: bash

    - name: configure
      run: |
        mkdir -p Build && cd Build
        cmake -G "Visual Studio 17 2022" -A x64 ..
      shell: bash

    # Still on the Node 20 runtime, hence the deprecation warning on this job.
    # Left pinned deliberately: a newer major may not exist, and an invalid tag
    # turns a warning into a hard failure. Bump only after checking the
    # marketplace.
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    # msbuild is invoked through cmd, the way it is in the sibling plugin repo.
    # The redirect keeps the output for the reporting step below; ERRORLEVEL is
    # stashed before `type` so the step still fails when the build does.
    - name: build-plugin
      shell: cmd
      run: |
        cd Build
        msbuild INSTALL.vcxproj -p:Configuration=${{ matrix.config }} -p:Platform=x64 -v:minimal > build.log 2>&1
        set BUILD_STATUS=%ERRORLEVEL%
        type build.log
        exit /b %BUILD_STATUS%

    # Downloading a job log needs admin rights on the repo; annotations do not.
    # Re-emitting the failure here makes a Windows-only break diagnosable by
    # anyone, which matters because this is the only platform whose socket code
    # is compiled nowhere else. Falls back to the tail of the log when nothing
    # matches, so the step can never report nothing at all.
    - name: surface build errors
      if: failure()
      shell: bash
      run: |
        log=Build/build.log
        if [ ! -f "$log" ]; then
          echo "::error::build-plugin produced no log -- it failed before msbuild ran"
          exit 0
        fi
        lines=$(grep -iE "error [A-Z]*[0-9]+|: error|fatal error|cannot open|unresolved external" "$log" \
                | sed 's/^[[:space:]]*//' | sort -u | head -25)
        [ -z "$lines" ] && lines=$(tail -40 "$log")
        printf '%s\n' "$lines" | while IFS= read -r line; do
          [ -n "$line" ] && echo "::error::$line"
        done

    # Visual Studio is a multi-config generator, so output lands in
    # Build/<Config>/. The PDB goes with it: it is what makes a crash report
    # from this binary readable.
    - name: collect
      shell: bash
      run: |
        mkdir -p dist
        cp Build/${{ matrix.config }}/*.dll dist/
        cp Build/${{ matrix.config }}/*.pdb dist/ || true
        ls -la dist/

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: glance-out-plugin-windows-${{ matrix.config }}
        path: dist/
        if-no-files-found: error
