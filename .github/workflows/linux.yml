# Build CI. There is deliberately NO deploy step.
#
# The Open Ephys plugin template's workflows end by uploading to
# openephys.jfrog.io/artifactory using secrets.ARTIFACTORY_ACCESS_TOKEN -- an
# Open Ephys org credential, under their package name. That is their release
# pipeline, not ours. If you ever sync a workflow from upstream, drop the
# deploy step again.
#
# Binaries are published as run artifacts instead: Actions tab -> a run ->
# Artifacts. They expire after the repo's retention window, 90 days by default.
#
# All three platforms are kept because Source/LhtrClient.cpp carries real
# _WIN32 branches (winsock2 vs POSIX sockets, ioctlsocket vs fcntl,
# closesocket) that a Linux-only build cannot exercise.
name: Linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-linux:
    runs-on: [ubuntu-22.04]

    strategy:
      # Don't let one config cancel the other: a broken Debug build should
      # still leave a downloadable Release binary.
      fail-fast: false
      matrix:
        config: [Release, Debug]

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    # Runs before the build because it needs neither JUCE nor Open Ephys, so a
    # wire-format regression is reported in seconds rather than after a full
    # plugin build. LaserDriver is the reference the bytes are diffed against;
    # without it the script can only self-check, which is not what this step is
    # for. Shallow clone, about 8 MB.
    - name: wire format
      run: |
        git clone --depth 1 https://github.com/ckemere/LaserDriver.git ../LaserDriver
        # Exit 2 means the reference was not found and only the self-consistency
        # half ran. That is a skip, not a failure -- it is how this step should
        # degrade if LaserDriver ever stops being readable. Anything else fails.
        bash test/run_protocol_test.sh ../LaserDriver || [ $? -eq 2 ]

    - name: setup
      run: |
        sudo apt update
        cd ../..
        git clone https://github.com/open-ephys/plugin-GUI.git --branch main
        sudo ./plugin-GUI/Resources/Scripts/install_linux_dependencies.sh
        cd plugin-GUI/Build && cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release ..

    - name: build
      run: |
        mkdir -p Build && cd Build
        cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.config }} ..
        make

    # Needs plugin-GUI for juce_core, which the setup step has now cloned.
    # Talks only to a stand-in broker on 127.0.0.1 -- no Pi, no laser.
    - name: loopback
      run: bash test/run_loopback_test.sh ../../plugin-GUI ../LaserDriver

    # Unix Makefiles is a single-config generator, so the .so lands straight in
    # Build/ rather than in a per-config subdirectory.
    - name: collect
      run: |
        mkdir -p dist
        cp Build/*.so dist/
        ls -la dist/

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: glance-out-plugin-linux-${{ matrix.config }}
        path: dist/
        if-no-files-found: error
